# ─────────────────────────────────────────────────────────────────────────────
# Deep Learning Models
# ─────────────────────────────────────────────────────────────────────────────
classifiers:
  gru:  false
  lstm: false
  tcn:  false
  tft:  false

regressors:
  gru:  false
  lstm: true        # ← LSTM pipeline active
  tcn:  false
  tft:  false

# Optuna trial budget per DL model
dl_n_trials: 2

# --- Default DL hyper-parameters (overridden by Optuna) ---
seq_len:     60      # look-back window (timesteps)
hidden_size: 64      # GRU/LSTM hidden dim; TCN/TFT channel width
num_layers:  2       # stacked layers / TCN blocks
dropout:     0.2
batch_size:  64
epochs:      50
lr:          0.001
patience:    10      # early-stopping patience


# ─────────────────────────────────────────────────────────────────────────────
# LSTM Pipeline — Split & Output Settings
# ─────────────────────────────────────────────────────────────────────────────

# Primary 70 / 30 temporal split
# 70 % → training block  |  30 % → held-out test (log-return evaluation)
lstm_train_ratio: 0.70

# Within the 70 % training block:
# 90 % → actual model training  |  10 % → validation (early-stopping monitor)
lstm_val_ratio: 0.90

# Root directory for all CSV artefacts produced by lstm_pipeline.py
# Sub-folders are created automatically per symbol: outputs/<symbol>/
lstm_output_dir: "outputs"


