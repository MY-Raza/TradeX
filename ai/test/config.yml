# ─────────────────────────────────────────────────────────────────────────────
# Symbols & Date Range
# ─────────────────────────────────────────────────────────────────────────────
symbols:
  - btc
  - eth
  - bnb
  - ada
  - xrp
  - doge
  - sol
  - dot
  - matic
  - link

start_date: '2023-01-01'
end_date:   '2026-03-30'

# Legacy calendar split (used by GRU / TCN / TFT pipelines)
# The LSTM pipeline ignores this and uses lstm_train_ratio instead
train_ratio: 0.8
split_date:  '2025-07-01'

timehorizon: "1h"