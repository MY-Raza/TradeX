  ADXR: true
  APO: true
  AROON: true
  AROONOSC: true
  BOP: true
  CCI: true
  CMO: true
  DX: true
  MACD: true
  MACDEXT: true
  MFI: true
  MINUS_DI: true
  MINUS_DM: true
  MOM: true
