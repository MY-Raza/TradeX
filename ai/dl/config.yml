# ─────────────────────────────────────────────────────────────────────────────
# Deep Learning Models
# ─────────────────────────────────────────────────────────────────────────────
classifiers:
  gru:  false
  lstm: false
  tcn:  false
  tft:  false

regressors:
  gru:  false
  lstm: false
  tcn:  false
  tft:  true

  # Optuna trial budget per DL model
dl_n_trials: 2

  # --- Default DL hyper-parameters (overridden by Optuna) ---
seq_len:     60      # look-back window (timesteps)
hidden_size: 64      # GRU/LSTM hidden dim; TCN/TFT channel width
num_layers:  2       # stacked layers / TCN blocks
dropout:     0.2
batch_size:  64
epochs:      50
lr:          0.001
patience:    10      # early-stopping patience


indicators:

  # =========================
  # Overlap Studies
  # =========================
  BBANDS: true
  DEMA: true
  EMA: true
  HT_TRENDLINE: true
  KAMA: true
  MA: true
  MIDPOINT: true
  MIDPRICE: true
  SAR: true
  SAREXT: true
  SMA: true
  T3: true
  TEMA: true
  TRIMA: true
  WMA: true

  # =========================
  # Momentum Indicators
