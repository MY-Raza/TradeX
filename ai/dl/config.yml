forecasting_models:

  ARIMA: true
  VARIMA: true
  NBEATS: true
  TRANSFORMER: true


# =================================
# Model Parameters
# =================================

arima_params:
  p: 5
  d: 1
  q: 1


varima_params:
  p: 2
  d: 1
  q: 1


nbeats_params:
  input_chunk_length: 48
  output_chunk_length: 1
  n_epochs: 100
  batch_size: 32
  num_blocks: 4
  num_layers: 4
  layer_widths: 256
  random_state: 42


transformer_params:
  input_chunk_length: 48
  output_chunk_length: 1
  d_model: 64
  nhead: 4
  num_encoder_layers: 3
  num_decoder_layers: 3
  dim_feedforward: 128
  dropout: 0.1
  batch_size: 32
  n_epochs: 100
  random_state: 42


# =================================
# Training Settings
# =================================

training:

  use_gpu: true
  num_workers: 4

  early_stopping: true
  patience: 10

  validation_split: 0.2


# =================================
# Covariates
# =================================

covariates:

  use_past_covariates: true
  use_future_covariates: false

