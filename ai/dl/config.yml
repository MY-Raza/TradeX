  - btc
  - eth
  - bnb
  - ada
  - xrp
  - doge
  - sol
  - dot
  - matic
  - link

start_date: '2023-01-01'
end_date: '2026-03-30'

train_ratio: 0.8
split_date: '2025-07-01'

timehorizon: "1h"