forecasting_models:
  arima: true
  varima: true
  nbeats: true
  transformer: true


# =================================
# Model Parameters
# =================================

arima_params:
  p: 5
  d: 0     # log_return is I(0) — do NOT difference again
  q: 0     # MA terms add instability; pure AR(5) is more robust


varima_params:
  p: 1    # p=1 sufficient with rolling window; p=2 doubles parameter count
  d: 0    # log_return columns are already stationary — no differencing needed
  q: 0    # MUST be 0 — VARMA(q>0) is non-identifiable, causes hanging
  rolling_rows: 4320  # ~6 months at 1h; caps OLS matrix size for speed


nbeats_params:
  input_chunk_length: 24   # 48->24: halves per-batch cost on CPU
  output_chunk_length: 1
  n_epochs: 20             # 100->20: converges here; beyond = overfitting on CPU
  batch_size: 64           # 32->64: fewer gradient steps per epoch
  num_blocks: 2            # 4->2: smaller model, 2x faster forward pass
  num_layers: 2            # 4->2: fewer FC layers per block
  layer_widths: 128        # 256->128: halves matrix multiply cost
  random_state: 42
  rolling_rows: 4320       # ~6 months at 1h; avoids training on 22k rows


transformer_params:
  input_chunk_length: 48
  output_chunk_length: 1
  d_model: 64
  nhead: 4
  num_encoder_layers: 3
  num_decoder_layers: 3
  dim_feedforward: 128
  dropout: 0.1
  batch_size: 32
  n_epochs: 100
  random_state: 42


# =================================
# Training Settings
# =================================

training:

  use_gpu: false          # no GPU on this machine
  num_workers: 0          # 4-core CPU — keep workers at 0 to avoid overhead

  early_stopping: true
  patience: 10

  validation_split: 0.2

  high_performance: true  # set false to use 2 cores / half resources

  # ── Optuna hyperparameter search ────────────────────────────────────────
  # Set run_optuna: true to search for best hyperparameters before training.
  # Results are stored in optuna_tradex.db and reused on the next run.
  run_optuna: false
  optuna_trials: 30              # trials per model (increase for better results)
  optuna_timeout_per_model: null # wall-clock seconds per model (null = no limit)


