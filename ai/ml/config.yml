start_date: '2023-01-01' 
end_date: '2026-02-17'
split_date: '2025-01-01'

xgboost_classifier_params:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1
    eval_metric: "logloss"

xgboost_regressor_params:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1


timehorizon: "1h"   # 1m, 5m, 15m, 1h, 4h, 1d